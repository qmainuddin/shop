server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://db:5432/shop
    username: shop
    password: shop
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
